---
name: "release"

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    name: "Build ${{ matrix.arch }}"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'
      - name: Run tests
        run: ./gradlew test
      - name: Build native image
        run: ./gradlew nativeCompile
      - name: Rename artifact
        run: mv ./build/native/nativeCompile/accounts-manager ./build/native/nativeCompile/accounts-manager-${{ matrix.arch }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: accounts-manager-${{ matrix.arch }}
          path: ./build/native/nativeCompile/accounts-manager-${{ matrix.arch }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/accounts-manager-*
          generate_release_notes: true
